[package]
name = "core-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Binary `bench` precisa, então sai de dev-dep.
tempfile = "3"
# Search opcional — feature-gated pra quem não precisar de FTS5 não
# pagar o custo do SQLite bundled (~1MB).
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[features]
default = ["search"]
search = ["rusqlite"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
