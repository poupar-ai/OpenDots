[package]
name = "api-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Servidor HTTP do open-poupar. Paridade com `plugin/ui/server.cjs` (3.665 linhas).
# Lib pura (handlers + state + routing) + bin thin (bind + listen).
[lib]
path = "src/lib.rs"

[[bin]]
name = "poupar-http"
path = "src/bin/http.rs"

[dependencies]
core-paths = { path = "../core-paths" }
core-storage = { path = "../core-storage" }
core-ports = { path = "../core-ports" }
core-queue = { path = "../core-queue" }
domain-agents = { path = "../domain-agents" }
domain-architect = { path = "../domain-architect" }
domain-best-practices = { path = "../domain-best-practices" }
domain-bus = { path = "../domain-bus" }
domain-cron = { path = "../domain-cron" }
domain-destructive = { path = "../domain-destructive" }
domain-graph = { path = "../domain-graph" }
domain-humans = { path = "../domain-humans" }
domain-ide-adapters = { path = "../domain-ide-adapters" }
domain-integrity = { path = "../domain-integrity" }
domain-sigilo = { path = "../domain-sigilo" }
domain-pipelines = { path = "../domain-pipelines" }
domain-router = { path = "../domain-router" }
domain-seed = { path = "../domain-seed" }
domain-skills-install = { path = "../domain-skills-install" }
domain-training-export = { path = "../domain-training-export" }
adapter-vault-file = { path = "../adapter-vault-file" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
bytes = { workspace = true }
mime_guess = { workspace = true }
regex = { workspace = true }
tokio-stream = "0.1"
futures-util = "0.3"
if-addrs = "0.13"
base64 = "0.22"
thiserror = { workspace = true }
# Identidade de agentes (Fase C — keypair Ed25519 + JWT por spawn).
# - ed25519-dalek 2.x faz Ed25519 sign/verify com chaves de 32 bytes.
# - rand_core/OsRng pra geração de chaves (entropy do SO).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Bind Unix socket (POUPAR_BIND_UNIX). axum 0.7 só aceita TCP no
# serve(), então fazemos accept loop manual com hyper direto.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Snapshot/restore — tarball + gzip + sha256.
tar = "0.4"
flate2 = "1"
sha2 = { workspace = true }
hex = { workspace = true }
# Hash de senha de humano (PBKDF2-HMAC-SHA256) — mesmo KDF do cofre.
pbkdf2 = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
