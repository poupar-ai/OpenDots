[workspace]
resolver = "2"
members = [
    "crates/adapter-fs",
    "crates/adapter-vault-file",
    "crates/api-cli",
    "crates/api-hooks",
    "crates/api-http",
    "crates/api-mcp",
    "crates/core-branding",
    "crates/core-ports",
    "crates/core-paths",
    "crates/core-queue",
    "crates/core-storage",
    "crates/domain-agents",
    "crates/domain-architect",
    "crates/domain-best-practices",
    "crates/domain-bus",
    "crates/domain-cron",
    "crates/domain-destructive",
    "crates/domain-firefighter",
    "crates/domain-github-tools",
    "crates/domain-graph",
    "crates/domain-humans",
    "crates/domain-ide-adapters",
    "crates/domain-indexer",
    "crates/domain-integrity",
    "crates/domain-nudge",
    "crates/domain-pipelines",
    "crates/domain-router",
    "crates/domain-seed",
    "crates/domain-session",
    "crates/domain-sigilo",
    "crates/domain-skills-install",
    "crates/domain-training-export",
    "crates/domain-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-PolyForm-Internal-Use-1.0.0 OR LicenseRef-Commercial"
repository = "https://github.com/poupar-ai/OpenDots"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
regex = "1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
bytes = "1"
mime_guess = "2"
time = { version = "=0.3.47", default-features = false, features = ["std", "macros", "parsing"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
