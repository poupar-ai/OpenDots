<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>project-mem</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #388bfd;
      --green: #3fb950;
      --yellow: #d29922;
      --orange: #fb923c;
      --red: #f85149;
      --purple: #a371f7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    .project-name { color: var(--text); font-weight: 600; }
    .stats { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 16px; }
    .stat-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 12px;
    }
    .stat-badge.ok { border-color: var(--green); color: var(--green); }
    .stat-badge.warn { border-color: var(--yellow); color: var(--yellow); }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      background: var(--surface);
    }

    .tab {
      padding: 10px 18px;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
      font-size: 13px;
      font-weight: 500;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    main { padding: 24px; max-width: 1100px; margin: 0 auto; }

    .panel { display: none; }
    .panel.active { display: block; }

    /* PROJECT.md */
    .project-md {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
    }
    .no-data {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }
    .no-data code {
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--accent);
    }

    /* Sessions */
    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 10px;
    }
    .session-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .session-date { color: var(--muted); font-size: 12px; font-family: monospace; }
    .session-obs { background: var(--surface2); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--muted); }
    .session-summary { color: var(--text); font-size: 13px; }

    /* Observations */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--muted); }

    .obs-list { display: flex; flex-direction: column; gap: 4px; }
    .obs-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: monospace;
      font-size: 12px;
    }
    .obs-item:hover { border-color: var(--border); background: var(--surface2); }
    .obs-ts { color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .obs-type {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .obs-type.file_edit { background: rgba(56,139,253,0.15); color: var(--accent); }
    .obs-type.bash { background: rgba(63,185,80,0.15); color: var(--green); }
    .obs-type.note { background: rgba(163,113,247,0.15); color: var(--purple); }
    .obs-type.agent_call { background: rgba(163,113,247,0.15); color: var(--purple); }
    .obs-type.firefighter_triage { background: rgba(210,153,34,0.18); color: var(--yellow); }
    .obs-content { color: var(--text); word-break: break-all; }
    .obs-exit-ok { color: var(--green); margin-left: 6px; }
    .obs-exit-fail { color: var(--red); margin-left: 6px; }
    .obs-extra { color: var(--muted); margin-left: 8px; font-size: 11px; }

    .count-badge { color: var(--muted); font-size: 12px; margin-bottom: 12px; }

    /* Soul — tratamento especial, cor púrpura + aura */
    .soul-md {
      background: linear-gradient(180deg, rgba(163,113,247,0.08) 0%, var(--surface) 100%);
      border: 1px solid var(--purple);
      border-radius: 8px;
      padding: 24px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      box-shadow: 0 0 24px rgba(163,113,247,0.08);
    }
    .tab.soul.active { color: var(--purple); border-bottom-color: var(--purple); }
    .tab.soul:hover { color: var(--purple); }

    /* Generic markdown-ish panel (DECISIONS/GOTCHAS) */
    .md-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
    }

    /* Cards for decisions / corrections / gotchas */
    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 10px;
    }
    .entry-card .entry-date { color: var(--muted); font-size: 12px; font-family: monospace; margin-bottom: 4px; }
    .entry-card .entry-what { color: var(--text); font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .entry-card .entry-why  { color: var(--muted); font-size: 13px; font-style: italic; }
    .entry-card.correction  { border-left: 3px solid var(--yellow); }
    .entry-card.gotcha      { border-left: 3px solid var(--red); }
    .entry-card.decision    { border-left: 3px solid var(--accent); }

    .refresh-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Agentes — canvas + sidebar */
    .agents-wrap {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 16px;
      height: calc(100vh - 200px);
      min-height: 540px;
    }
    @media (max-width: 1020px) { .agents-wrap { grid-template-columns: 1fr; height: auto; } }
    .agents-canvas {
      background: radial-gradient(ellipse at center, rgba(163,113,247,0.06), var(--surface) 70%);
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      min-height: 500px;
    }
    .agents-canvas svg { width: 100%; height: 100%; display: block; }
    .agent-node {
      cursor: pointer;
      transition: transform 0.15s;
    }
    .agent-node:hover { filter: brightness(1.2); }
    .agent-node circle { transition: stroke-width 0.2s; }
    .agent-node.active circle.ring {
      animation: pulse 1.2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { stroke-opacity: 0.9; stroke-width: 2; }
      50%  { stroke-opacity: 0.3; stroke-width: 10; }
      100% { stroke-opacity: 0.9; stroke-width: 2; }
    }
    .agent-node .led {
      fill: var(--green);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .agent-node.active .led {
      opacity: 1;
      animation: blink-led 1s ease-in-out infinite;
    }
    @keyframes blink-led {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .agent-node .working-label {
      font-size: 11px;
      font-weight: 600;
      fill: var(--green);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .agent-node.active .working-label { opacity: 1; }
    .agent-node text {
      pointer-events: none;
      user-select: none;
    }
    .agent-sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      overflow-y: auto;
    }
    .agent-sidebar h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .agent-sidebar .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    .agent-sidebar .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tiny-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }
    .tiny-badge.accent { border-color: var(--accent); color: var(--accent); }
    .tiny-badge.purple { border-color: var(--purple); color: var(--purple); }
    .tiny-badge.green  { border-color: var(--green); color: var(--green); }
    .tiny-badge.orange { border-color: var(--orange); color: var(--orange); }
    .tiny-badge.red    { border-color: var(--red); color: var(--red); }
    .tiny-badge.yellow { border-color: var(--yellow); color: var(--yellow); }
    .agent-sidebar .mini-ctx {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      color: var(--text);
      max-height: 220px;
      overflow-y: auto;
    }

    /* Chat estilo WhatsApp ─────────────────────────────────────── */
    .chat-panel {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #1f2c33;
      border-radius: 10px 10px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .chat-header .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      border: 2px solid;
    }
    .chat-header .avatar.green       { border-color: var(--green); }
    .chat-header .avatar.orange      { border-color: var(--orange); }
    .chat-header .avatar.red         { border-color: var(--red); }
    .chat-header .avatar.yellow      { border-color: var(--yellow); }
    .chat-header .avatar.purple      { border-color: var(--purple); }
    .chat-header .avatar.accent      { border-color: var(--accent); }
    .chat-header .name { font-size: 14px; font-weight: 600; color: var(--text); }
    .chat-header .status { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .chat-header .status.online::before {
      content: '●';
      color: var(--green);
      margin-right: 4px;
      font-size: 10px;
    }
    .chat-header .actions { margin-left: auto; }
    .chat-header .actions button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 4px 8px;
    }
    .chat-header .actions button:hover { color: var(--accent); }

    .chat-log {
      background: #0b141a
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><circle cx='30' cy='30' r='0.5' fill='%23ffffff08'/></svg>");
      border: 1px solid var(--border);
      border-top: none;
      padding: 14px 12px 8px;
      height: 360px;
      overflow-y: auto;
      font-size: 13.5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-log:empty::before {
      content: 'Sem mensagens ainda. Mande um "oi".';
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
      margin: auto;
    }
    .chat-msg {
      max-width: 82%;
      padding: 6px 8px 4px;
      border-radius: 8px;
      line-height: 1.45;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
      margin-bottom: 2px;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #005c4b;
      color: #e9edef;
      border-top-right-radius: 0;
    }
    .chat-msg.user::after {
      content: '';
      position: absolute;
      top: 0; right: -8px;
      width: 0; height: 0;
      border-top: 8px solid #005c4b;
      border-right: 8px solid transparent;
    }
    .chat-msg.agent {
      align-self: flex-start;
      background: #202c33;
      color: #e9edef;
      border-top-left-radius: 0;
    }
    .chat-msg.agent::before {
      content: '';
      position: absolute;
      top: 0; left: -8px;
      width: 0; height: 0;
      border-top: 8px solid #202c33;
      border-left: 8px solid transparent;
    }
    .chat-msg .body { white-space: normal; }
    .chat-msg .body > *:first-child { margin-top: 0; }
    .chat-msg .body > *:last-child  { margin-bottom: 0; }
    .chat-msg .body p  { margin: 3px 0; }
    .chat-msg .body ul, .chat-msg .body ol { margin: 4px 0 4px 4px; padding-left: 18px; }
    .chat-msg .body li { margin: 1px 0; }
    .chat-msg .body strong { font-weight: 700; color: #ffffff; }
    .chat-msg .body em     { font-style: italic; }
    .chat-msg .body code {
      background: rgba(0,0,0,0.35);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 90%;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
    }
    .chat-msg .body pre {
      background: rgba(0,0,0,0.45);
      padding: 8px 10px;
      border-radius: 5px;
      overflow-x: auto;
      margin: 6px 0;
      font-size: 12px;
    }
    .chat-msg .body pre code {
      background: transparent;
      padding: 0;
      font-size: inherit;
    }
    .chat-msg .body a { color: #53bdeb; text-decoration: none; }
    .chat-msg .body a:hover { text-decoration: underline; }
    .chat-msg .body .md-h1, .chat-msg .body .md-h2, .chat-msg .body .md-h3 {
      font-weight: 700;
      color: #ffffff;
      margin: 6px 0 2px;
    }
    .chat-msg .body .md-h1 { font-size: 15px; }
    .chat-msg .body .md-h2 { font-size: 14px; }
    .chat-msg .body .md-h3 { font-size: 13px; color: #c9d2d9; }
    .chat-msg .time {
      float: right;
      font-size: 10.5px;
      color: rgba(255,255,255,0.45);
      margin: 4px 0 0 8px;
      padding-top: 2px;
    }
    .chat-msg .time::after { content: ''; clear: both; }
    .chat-msg.streaming .body::after {
      content: '▌';
      color: #53bdeb;
      animation: blink 0.9s steps(2) infinite;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .chat-day {
      align-self: center;
      background: rgba(11,20,26,0.6);
      color: #c9d2d9;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 7px;
      margin: 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chat-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1f2c33;
      padding: 10px 12px;
      border-radius: 0 0 10px 10px;
      border: 1px solid var(--border);
      border-top: none;
    }
    .chat-form textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      resize: none;
      min-height: 36px;
      max-height: 120px;
      line-height: 1.4;
    }
    .chat-form textarea:focus { outline: none; border-color: var(--accent); }
    .chat-form .row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .chat-form .hint { color: var(--muted); font-size: 10.5px; }
    .chat-form button {
      background: #00a884;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .agents-rule {
      background: linear-gradient(90deg, rgba(163,113,247,0.10), transparent);
      border-left: 3px solid var(--purple);
      padding: 10px 16px;
      border-radius: 4px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--text);
    }
    .agents-empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🧠</span>
  <span class="logo" style="font-size:14px">project-mem</span>
  <span style="color:var(--border)">|</span>
  <span class="project-name" id="proj-name">…</span>
  <div class="stats" id="stats-bar"></div>
</header>

<div class="tabs">
  <div class="tab soul active" data-panel="soul">✨ Alma</div>
  <div class="tab" data-panel="project">PROJECT.md</div>
  <div class="tab" data-panel="decisions">Decisões</div>
  <div class="tab" data-panel="corrections">Correções</div>
  <div class="tab" data-panel="gotchas">Armadilhas</div>
  <div class="tab" data-panel="glossary">Glossário</div>
  <div class="tab" data-panel="code-index">Code Index</div>
  <div class="tab" data-panel="agents">Agentes</div>
  <div class="tab" data-panel="sessions">Sessões</div>
  <div class="tab" data-panel="observations">Observações</div>
</div>

<main>
  <!-- SOUL.md -->
  <div class="panel active" id="panel-soul">
    <pre class="soul-md" id="soul-md-content">Carregando…</pre>
  </div>

  <!-- PROJECT.md -->
  <div class="panel" id="panel-project">
    <pre class="project-md" id="project-md-content">Carregando…</pre>
  </div>

  <!-- Decisions -->
  <div class="panel" id="panel-decisions">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="count-badge" id="decisions-count"></span>
      <button class="refresh-btn" onclick="load()">↺ Atualizar</button>
    </div>
    <div id="decisions-list"></div>
  </div>

  <!-- Corrections -->
  <div class="panel" id="panel-corrections">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="count-badge" id="corrections-count"></span>
      <button class="refresh-btn" onclick="load()">↺ Atualizar</button>
    </div>
    <div id="corrections-list"></div>
  </div>

  <!-- Gotchas -->
  <div class="panel" id="panel-gotchas">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="count-badge" id="gotchas-count"></span>
      <button class="refresh-btn" onclick="load()">↺ Atualizar</button>
    </div>
    <div id="gotchas-list"></div>
  </div>

  <!-- Glossary -->
  <div class="panel" id="panel-glossary">
    <pre class="md-panel" id="glossary-md-content">Carregando…</pre>
  </div>

  <!-- Code Index -->
  <div class="panel" id="panel-code-index">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="count-badge" id="code-index-count"></span>
      <button class="refresh-btn" onclick="load()">↺ Atualizar</button>
      <span style="color:var(--muted);font-size:12px;margin-left:auto">Rode <code style="background:var(--surface2);padding:2px 6px;border-radius:4px;color:var(--accent)">/mem-index</code> pra rebuild completo</span>
    </div>
    <pre class="md-panel" id="code-index-md-content">Carregando…</pre>
  </div>

  <!-- Agents -->
  <div class="panel" id="panel-agents">
    <div id="agents-rule"></div>
    <div class="agents-wrap">
      <div class="agents-canvas">
        <svg id="agents-svg" viewBox="0 0 800 540" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="agent-sidebar" id="agent-sidebar">
        <div id="agent-info"><div class="no-data">Clique em um agente pra ver detalhes.</div></div>
        <div id="agent-chat"></div>
      </div>
    </div>
  </div>

  <!-- Sessions -->
  <div class="panel" id="panel-sessions">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="count-badge" id="sessions-count"></span>
      <button class="refresh-btn" onclick="load()">↺ Atualizar</button>
    </div>
    <div id="sessions-list"></div>
  </div>

  <!-- Observations -->
  <div class="panel" id="panel-observations">
    <div class="search-bar">
      <input id="obs-search" type="text" placeholder="Buscar observações…" oninput="renderObs()">
      <button class="refresh-btn" onclick="load()">↺ Atualizar</button>
    </div>
    <div class="count-badge" id="obs-count"></div>
    <div class="obs-list" id="obs-list"></div>
  </div>
</main>

<script>
  let data = null;

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  async function load() {
    try {
      const res = await fetch('/api/data');
      data = await res.json();
      render();
    } catch (e) {
      document.getElementById('project-md-content').textContent = 'Erro ao carregar: ' + e.message;
    }
  }

  function render() {
    // Header
    document.getElementById('proj-name').textContent = data.project.name;
    document.getElementById('stats-bar').innerHTML = `
      <span class="stat-badge ${data.stats.hasSoul ? 'ok' : 'warn'}" style="${data.stats.hasSoul ? 'border-color:var(--purple);color:var(--purple)' : ''}">
        ${data.stats.hasSoul ? '✨ alma ✓' : '✨ alma ✗'}
      </span>
      <span class="stat-badge ${data.stats.hasProjectMd ? 'ok' : 'warn'}">
        ${data.stats.hasProjectMd ? 'PROJECT ✓' : 'PROJECT ✗'}
      </span>
      <span class="stat-badge">${data.stats.decisions} dec</span>
      <span class="stat-badge">${data.stats.corrections} corr</span>
      <span class="stat-badge">${data.stats.gotchas} arm</span>
      <span class="stat-badge">${data.stats.sessions} ses</span>
      <span class="stat-badge">${data.stats.observations} obs</span>
      ${data.stats.tokens && data.stats.tokens.last ? `
        <span class="stat-badge ${data.stats.tokens.skipped.length > 0 ? 'warn' : 'ok'}" title="Última injeção no contexto do Claude">
          ~${data.stats.tokens.last}/${data.stats.tokens.budget}t
        </span>
      ` : ''}
      ${data.stats.codeIndex ? `
        <span class="stat-badge">${data.stats.codeIndex.symbols} símbolos</span>
      ` : ''}
    `;

    // SOUL.md
    const soul = document.getElementById('soul-md-content');
    if (data.soulMd) {
      soul.textContent = data.soulMd;
    } else {
      soul.innerHTML = `<div class="no-data">
        Este projeto ainda não tem alma definida.<br><br>
        Rode <code>/mem-soul</code> no Claude Code para iniciar a conversa sobre valores, filosofia e voz do projeto.<br><br>
        <span style="color:var(--muted);font-size:12px">A alma é a camada mais estável da memória — define <em>quem</em> o projeto é, não <em>o que</em> ele fez.</span>
      </div>`;
    }

    // PROJECT.md
    const md = document.getElementById('project-md-content');
    if (data.projectMd) {
      md.textContent = data.projectMd;
    } else {
      md.innerHTML = `<div class="no-data">
        Nenhum PROJECT.md encontrado.<br><br>
        Rode <code>/mem-setup</code> no Claude Code para analisar o projeto.
      </div>`;
    }

    // Decisions
    renderEntries('decisions', data.decisions, 'decision', d => ({
      date:    (d.ts || '').slice(0, 10),
      what:    d.what || d.text || '(sem título)',
      why:     d.why || null
    }));

    // Corrections
    renderEntries('corrections', data.corrections, 'correction', c => {
      const prev = c.previous_action
        ? (c.previous_action.type === 'file_edit'
            ? `após editar ${c.previous_action.file}`
            : `após rodar \`${c.previous_action.cmd}\``)
        : 'sem ação anterior';
      return {
        date: (c.ts || '').slice(0, 10),
        what: c.prompt || '',
        why:  prev
      };
    });

    // Gotchas
    renderEntries('gotchas', data.gotchas, 'gotcha', g => ({
      date: (g.ts || '').slice(0, 10),
      what: g.description || '',
      why:  g.failure_hint ? `Sintoma: ${g.failure_hint}` : (g.file || '')
    }));

    // Glossary
    const gl = document.getElementById('glossary-md-content');
    if (data.glossaryMd) {
      gl.textContent = data.glossaryMd;
    } else {
      gl.innerHTML = `<div class="no-data">
        Nenhum GLOSSARY.md encontrado.<br><br>
        Alimente <code>.claude-project-memory/glossary.jsonl</code> com entradas <code>{"term": "…", "definition": "…"}</code> e o plugin gera o markdown ao final da sessão.
      </div>`;
    }

    // Code Index
    const ci = document.getElementById('code-index-md-content');
    const ciCount = document.getElementById('code-index-count');
    if (data.codeIndexMd && data.stats.codeIndex) {
      ci.textContent = data.codeIndexMd;
      const c = data.stats.codeIndex;
      const genAt = (c.generated_at || '').slice(0, 16).replace('T', ' ');
      ciCount.textContent = `${c.files} arquivos · ${c.symbols} símbolos · gerado ${genAt}`;
    } else {
      ci.innerHTML = `<div class="no-data">
        Nenhum CODE_INDEX.md encontrado.<br><br>
        Rode <code>/mem-index</code> no Claude Code para construir o mapa de símbolos.<br><br>
        <span style="color:var(--muted);font-size:12px">Extração automática de funções, classes, endpoints e tabelas — atualizado a cada sessão.</span>
      </div>`;
      ciCount.textContent = '';
    }

    // Sessions
    const sessList = document.getElementById('sessions-list');
    document.getElementById('sessions-count').textContent = `${data.sessions.length} sessões completadas`;
    if (data.sessions.length === 0) {
      sessList.innerHTML = '<div class="no-data">Nenhuma sessão registrada ainda.</div>';
    } else {
      sessList.innerHTML = data.sessions.map(s => {
        const date = (s.ended_at || '').slice(0, 16).replace('T', ' ');
        const kind = s.kind ? `<span class="session-obs" style="background:rgba(163,113,247,0.15);color:var(--purple)">${esc(s.kind)}</span>` : '';
        return `<div class="session-card">
          <div class="session-header">
            <span class="session-date">${date}</span>
            <span class="session-obs">${s.obs_count || 0} obs</span>
            ${kind}
          </div>
          <div class="session-summary">${esc(s.summary || '—')}</div>
        </div>`;
      }).join('');
    }

    renderAgents();
    renderObs();
  }

  let selectedAgent = null;
  let chatMountedFor = null;
  let chatStreaming  = false;

  // Markdown mínimo: headings, bold, italic, inline/block code, listas, links.
  function renderMarkdown(src) {
    if (!src) return '';

    // 1) Protege code blocks (para não escapar HTML dentro)
    const blocks = [];
    src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push(code);
      return `\x00B${blocks.length - 1}\x00`;
    });

    // 2) Escapa HTML
    src = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // 3) Inline code `x`
    src = src.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // 4) Links [text](url)
    src = src.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // 5) Bold e italic
    src = src.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    src = src.replace(/(^|\s)_([^_\n]+)_(?=\s|$|[.,!?;:])/g, '$1<em>$2</em>');

    // 6) Headings (viram divs estilizadas)
    src = src.replace(/^###\s+(.+)$/gm, '<div class="md-h3">$1</div>');
    src = src.replace(/^##\s+(.+)$/gm,  '<div class="md-h2">$1</div>');
    src = src.replace(/^#\s+(.+)$/gm,   '<div class="md-h1">$1</div>');

    // 7) Listas (linha a linha — agrupa em <ul>/<ol>)
    const lines = src.split('\n');
    const out = [];
    let inList = null;
    for (const line of lines) {
      const ulM = /^\s*[-*]\s+(.+)$/.exec(line);
      const olM = /^\s*\d+\.\s+(.+)$/.exec(line);
      if (ulM) {
        if (inList !== 'ul') { if (inList) out.push(`</${inList}>`); out.push('<ul>'); inList = 'ul'; }
        out.push(`<li>${ulM[1]}</li>`);
      } else if (olM) {
        if (inList !== 'ol') { if (inList) out.push(`</${inList}>`); out.push('<ol>'); inList = 'ol'; }
        out.push(`<li>${olM[1]}</li>`);
      } else {
        if (inList) { out.push(`</${inList}>`); inList = null; }
        out.push(line);
      }
    }
    if (inList) out.push(`</${inList}>`);
    src = out.join('\n');

    // 8) Parágrafos (blocos separados por linha em branco)
    src = src.split(/\n{2,}/).map(p => {
      p = p.trim();
      if (!p) return '';
      if (/^<(ul|ol|pre|div|h\d)/.test(p)) return p;
      if (/^\x00B\d+\x00/.test(p)) return p;
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('');

    // 9) Restaura code blocks
    src = src.replace(/\x00B(\d+)\x00/g, (_, i) => {
      const code = blocks[parseInt(i, 10)]
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<pre><code>${code}</code></pre>`;
    });

    return src;
  }

  function fmtTime(isoTs) {
    try {
      const d = isoTs ? new Date(isoTs) : new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }
  function fmtDayKey(isoTs) {
    try { return new Date(isoTs || Date.now()).toDateString(); } catch { return ''; }
  }
  function fmtDayLabel(key) {
    const today = new Date().toDateString();
    const y = new Date(Date.now() - 86400000).toDateString();
    if (key === today) return 'Hoje';
    if (key === y)     return 'Ontem';
    try { return new Date(key).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }); }
    catch { return key; }
  }

  function setNodeWorking(name, label) {
    const g = document.querySelector(`.agent-node[data-name="${CSS.escape(name)}"]`);
    if (!g) return;
    g.classList.add('active');
    const text = g.querySelector('.working-label');
    if (text && label) text.textContent = label;
  }
  function clearNodeWorking(name) {
    const g = document.querySelector(`.agent-node[data-name="${CSS.escape(name)}"]`);
    if (!g) return;
    // só remove se não houver outro motivo pra estar "active" (invocação recente < 30s)
    g.classList.remove('active');
    const text = g.querySelector('.working-label');
    if (text) text.textContent = '';
  }

  function renderAgents() {
    const svg  = document.getElementById('agents-svg');
    const rule = document.getElementById('agents-rule');
    const side = document.getElementById('agent-sidebar');

    if (!data.agents || !data.agents.manifest) {
      svg.innerHTML = '';
      rule.innerHTML = '';
      side.innerHTML = `<div class="agents-empty">
        Nenhum agente declarado.<br><br>
        Rode <code style="background:var(--surface2);padding:2px 6px;border-radius:4px;color:var(--accent)">/mem-agents init</code>
        pra criar Manager, Oracle e especialistas com defaults.
      </div>`;
      return;
    }

    const { manifest, contexts, counts, recent } = data.agents;
    const agentsObj = manifest.agents || {};
    const names = Object.keys(agentsObj);
    const managerName = manifest.manager || 'manager';
    const oracleName  = manifest.oracle  || 'oracle';

    rule.innerHTML = manifest.rule
      ? `<div class="agents-rule"><strong>Regra de ouro:</strong> ${esc(manifest.rule)}</div>`
      : '';

    // Layout: Manager no centro. Oracle próximo. Especialistas em anel interno.
    // Integradores em anel médio. Motores em anel externo (mais distantes — agem no mundo).
    const W = 800, H = 540;
    const cx = W / 2, cy = H / 2;
    const positions = {};
    positions[managerName] = { x: cx, y: cy };

    const typeOf = (n) => (agentsObj[n] && agentsObj[n].type) || 'specialist';

    const others = names.filter(n => n !== managerName);
    const oracleIdx = others.indexOf(oracleName);
    if (oracleIdx !== -1) {
      positions[oracleName] = { x: cx + 170, y: cy - 110 };
      others.splice(oracleIdx, 1);
    }

    const byType = { specialist: [], integrator: [], motor: [], firefighter: [], core: [] };
    for (const n of others) {
      const t = typeOf(n);
      (byType[t] || byType.specialist).push(n);
    }

    const rings = [
      { list: byType.specialist.concat(byType.core), R: 170, startA: Math.PI / 2 },
      { list: byType.integrator,                     R: 240, startA: Math.PI },
      { list: byType.firefighter,                    R: 280, startA: 0 },
      { list: byType.motor,                          R: 330, startA: -Math.PI / 2 }
    ];
    for (const ring of rings) {
      const n = ring.list.length;
      if (n === 0) continue;
      ring.list.forEach((name, i) => {
        const a = ring.startA + (i / n) * Math.PI * 2;
        positions[name] = { x: cx + Math.cos(a) * ring.R, y: cy + Math.sin(a) * ring.R * 0.78 };
      });
    }

    // Estado "trabalhando": 3 gatilhos possíveis, cada um com label distinto.
    const now = Date.now();
    const workingLabel = {};  // { name: 'pensando…' | 'triando 🚒' | 'trabalhando' }

    // 1. Invocação recente via Task/Agent tool (< 30s)
    for (const [name, ts] of Object.entries(recent || {})) {
      if (ts && (now - new Date(ts).getTime()) < 30_000) workingLabel[name] = 'trabalhando';
    }
    // 2. Firefighter triage recente (< 60s) — sobrescreve
    for (const o of (data.observations || []).slice(0, 80)) {
      if (o.type === 'firefighter_triage' && o.ts && (now - new Date(o.ts).getTime()) < 60_000) {
        workingLabel[o.agent] = 'triando 🚒';
      }
    }
    // 3. Streaming de chat ativo no agente selecionado — sempre ganha
    if (chatStreaming && selectedAgent) workingLabel[selectedAgent] = 'pensando…';

    const active = new Set(Object.keys(workingLabel));

    // Renderiza conexões (can_talk_to)
    const edges = [];
    const edgeSet = new Set();
    for (const [name, a] of Object.entries(agentsObj)) {
      for (const target of (a.can_talk_to || [])) {
        if (!positions[target] || !positions[name]) continue;
        const key = [name, target].sort().join('|');
        if (edgeSet.has(key)) continue;
        edgeSet.add(key);
        edges.push({ from: name, to: target });
      }
    }

    const edgeSvg = edges.map(e => {
      const a = positions[e.from], b = positions[e.to];
      const isManager = e.from === managerName || e.to === managerName;
      const stroke = isManager ? 'var(--purple)' : 'var(--border)';
      const op = isManager ? 0.5 : 0.25;
      return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-opacity="${op}" stroke-width="1.5"/>`;
    }).join('');

    const typeStyle = {
      core_manager: { color: 'var(--purple)', fill: 'rgba(163,113,247,0.18)' },
      core_oracle:  { color: 'var(--accent)', fill: 'rgba(56,139,253,0.14)'  },
      specialist:   { color: 'var(--green)',  fill: 'rgba(63,185,80,0.10)'   },
      integrator:   { color: 'var(--orange)', fill: 'rgba(251,146,60,0.12)'  },
      motor:        { color: 'var(--red)',    fill: 'rgba(248,81,73,0.12)'   },
      firefighter:  { color: 'var(--yellow)', fill: 'rgba(210,153,34,0.14)'  }
    };

    const nodeSvg = names.map(name => {
      const p = positions[name];
      if (!p) return '';
      const a = agentsObj[name];
      const isManager = name === managerName;
      const isOracle  = name === oracleName;
      const t = a.type || 'specialist';
      const key = isManager ? 'core_manager' : (isOracle ? 'core_oracle' : t);
      const style = typeStyle[key] || typeStyle.specialist;
      const r = isManager ? 46 : (isOracle ? 40 : 34);
      const isActive = active.has(name);
      const count = counts[name] || 0;
      const label = workingLabel[name] || '';
      return `<g class="agent-node ${isActive ? 'active' : ''}" data-name="${esc(name)}" transform="translate(${p.x},${p.y})">
        <circle class="ring" r="${r}" fill="${style.fill}" stroke="${style.color}" stroke-width="2"/>
        <text text-anchor="middle" dy="4" font-size="${r - 10}">${esc(a.emoji || '•')}</text>
        <circle class="led" cx="${r * 0.68}" cy="${-r * 0.68}" r="6"/>
        <text class="working-label" text-anchor="middle" y="${-r - 10}">${esc(label)}</text>
        <text text-anchor="middle" y="${r + 18}" fill="var(--text)" font-size="13" font-weight="600">${esc(name)}</text>
        ${count > 0 ? `<text text-anchor="middle" y="${r + 34}" fill="var(--muted)" font-size="11">${count}× chamado</text>` : ''}
      </g>`;
    }).join('');

    svg.innerHTML = edgeSvg + nodeSvg;

    // Click handling
    svg.querySelectorAll('.agent-node').forEach(g => {
      g.addEventListener('click', () => {
        const n = g.dataset.name;
        if (n === selectedAgent) return;
        if (chatStreaming && !confirm('Tem streaming em curso. Mudar de agente vai parar. Continuar?')) return;
        selectedAgent = n;
        chatMountedFor = null;  // força remount do chat
        renderAgentSidebar();
      });
    });

    if (!selectedAgent || !agentsObj[selectedAgent]) selectedAgent = managerName;
    renderAgentSidebar();

    function renderAgentSidebar() {
      const info = document.getElementById('agent-info');
      const chat = document.getElementById('agent-chat');
      if (!agentsObj[selectedAgent]) { info.innerHTML = ''; chat.innerHTML = ''; return; }
      const a = agentsObj[selectedAgent];
      const ctx = contexts[selectedAgent] || '';
      const count = counts[selectedAgent] || 0;
      const last = recent[selectedAgent] ? ' · último: ' + recent[selectedAgent].slice(0, 16).replace('T', ' ') : '';
      const isM = selectedAgent === managerName;
      const isO = selectedAgent === oracleName;
      const typeCls = { specialist: 'green', integrator: 'orange', motor: 'red', firefighter: 'yellow', core: 'purple' };
      const tagCls = isM ? 'purple' : (isO ? 'accent' : (typeCls[a.type] || 'green'));
      const typeLabel = isM ? 'Manager' : (isO ? 'Oracle' : (a.type || 'specialist'));

      // Info: sempre re-renderizado (cheap, sem estado vivo)
      info.innerHTML = `
        <h3>${esc(a.emoji || '•')} ${esc(selectedAgent)}
          <span class="tiny-badge ${tagCls}">${esc(typeLabel)}</span>
        </h3>
        <div class="meta">${esc(a.role || '')}</div>
        <div class="badge-row">
          <span class="tiny-badge ${tagCls}">${esc(a.model || '?')}</span>
          <span class="tiny-badge">${count}× invocações${last}</span>
        </div>
        <div class="meta" style="margin-bottom:6px"><strong>Ferramentas:</strong></div>
        <div class="badge-row">
          ${(a.tools || []).map(t => `<span class="tiny-badge">${esc(t)}</span>`).join('') || '<span class="tiny-badge">—</span>'}
        </div>
        <div class="meta" style="margin-bottom:6px"><strong>MCPs:</strong></div>
        <div class="badge-row">
          ${(a.mcps || []).map(m => `<span class="tiny-badge">${esc(m)}</span>`).join('') || '<span class="tiny-badge">nenhum</span>'}
        </div>
        <div class="meta" style="margin-bottom:6px"><strong>Fala com:</strong></div>
        <div class="badge-row">
          ${(a.can_talk_to || []).map(t => `<span class="tiny-badge ${t === managerName ? 'purple' : ''}">${esc(t)}</span>`).join('') || '<span class="tiny-badge">ninguém</span>'}
        </div>
        <div class="meta" style="margin-top:14px;margin-bottom:6px"><strong>Mini-contexto (<code>${esc(a.context_file || '')}</code>):</strong></div>
        <div class="mini-ctx">${ctx ? esc(ctx) : '_(vazio — rode /mem-agents edit ' + esc(selectedAgent) + ')_'}</div>
      `;

      // Chat: só remonta quando o agente selecionado muda. Preserva log + stream em curso.
      if (chatMountedFor !== selectedAgent) {
        const avatarCls = isM ? 'purple' : (isO ? 'accent' : ({
          specialist: 'green', integrator: 'orange', motor: 'red', firefighter: 'yellow', core: 'purple'
        }[a.type] || 'green'));
        chat.innerHTML = `
          <div class="chat-panel">
            <div class="chat-header">
              <div class="avatar ${avatarCls}">${esc(a.emoji || '•')}</div>
              <div>
                <div class="name">${esc(selectedAgent)}</div>
                <div class="status online">online · ${esc(a.model || 'sonnet')}</div>
              </div>
              <div class="actions">
                <button type="button" id="chat-clear" title="Limpar conversa local">limpar</button>
              </div>
            </div>
            <div class="chat-log" id="chat-log"></div>
            <form class="chat-form" id="chat-form">
              <div class="row">
                <textarea id="chat-input" placeholder="Mensagem" rows="1"></textarea>
                <button type="submit" id="chat-send" title="Enviar (Ctrl+Enter)">➤</button>
              </div>
              <span class="hint">Ctrl+Enter envia · cada msg abre sessão nova do <code>claude -p</code></span>
            </form>
          </div>
        `;
        chatMountedFor = selectedAgent;
        wireChat(selectedAgent, a);
      }
    }
  }

  async function wireChat(agent, agentCfg) {
    const log  = document.getElementById('chat-log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');
    const clearBtn = document.getElementById('chat-clear');
    if (!log || !form) return;

    const typeCls = { specialist: '', integrator: 'integrator', motor: 'motor', firefighter: 'firefighter', core: 'core' }[agentCfg.type] || '';
    let lastDayKey = null;

    function maybeAddDay(ts) {
      const k = fmtDayKey(ts);
      if (k === lastDayKey) return;
      lastDayKey = k;
      const d = document.createElement('div');
      d.className = 'chat-day';
      d.textContent = fmtDayLabel(k);
      log.appendChild(d);
    }

    function nearBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    }
    function scrollToBottom(force) {
      if (force || nearBottom()) log.scrollTop = log.scrollHeight;
    }

    function renderMsg({ role, content, ts, streaming }) {
      maybeAddDay(ts || new Date().toISOString());
      const div = document.createElement('div');
      div.className = `chat-msg ${role}${role === 'agent' ? ' ' + typeCls : ''}${streaming ? ' streaming' : ''}`;
      div.innerHTML = `<div class="body"></div><span class="time">${esc(fmtTime(ts))}</span>`;
      const body = div.querySelector('.body');
      if (role === 'user') {
        body.textContent = content || '';
      } else {
        body.innerHTML = renderMarkdown(content || '');
      }
      log.appendChild(div);
      scrollToBottom(true);
      return div;
    }

    try {
      const r = await fetch(`/api/chat/history?agent=${encodeURIComponent(agent)}`);
      const { messages = [] } = await r.json();
      log.innerHTML = '';
      lastDayKey = null;
      messages.forEach(m => renderMsg(m));
    } catch {}

    clearBtn.onclick = () => { log.innerHTML = ''; lastDayKey = null; };

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(120, input.scrollHeight) + 'px';
    });
    input.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); form.requestSubmit(); }
    });

    form.onsubmit = async (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      input.style.height = 'auto';
      renderMsg({ role: 'user', content: msg, ts: new Date().toISOString() });
      sendBtn.disabled = true;
      chatStreaming = true;
      setNodeWorking(agent, 'pensando…');

      const agentDiv = renderMsg({ role: 'agent', content: '', ts: new Date().toISOString(), streaming: true });
      const body = agentDiv.querySelector('.body');
      let accumulated = '';
      let pendingRender = null;
      const renderNow = () => {
        body.innerHTML = renderMarkdown(accumulated);
        scrollToBottom(false);
        pendingRender = null;
      };
      const scheduleRender = () => {
        if (pendingRender) return;
        pendingRender = requestAnimationFrame(renderNow);
      };

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agent, message: msg })
        });
        if (!resp.ok || !resp.body) {
          body.textContent = `[erro ${resp.status}]`;
          agentDiv.classList.remove('streaming');
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const events = buf.split('\n\n');
          buf = events.pop();
          for (const ev of events) {
            const lines = ev.split('\n');
            let event = 'message', data = '';
            for (const l of lines) {
              if (l.startsWith('event: ')) event = l.slice(7).trim();
              else if (l.startsWith('data: ')) data += l.slice(6);
            }
            if (!data) continue;
            let parsed; try { parsed = JSON.parse(data); } catch { continue; }
            if (event === 'text') {
              accumulated += parsed.text || '';
              scheduleRender();
            } else if (event === 'error') {
              accumulated += `\n\n_[erro: ${parsed.message || parsed.stderr || ('exit ' + parsed.code)}]_`;
              scheduleRender();
            } else if (event === 'done') {
              renderNow();
              agentDiv.classList.remove('streaming');
            }
          }
        }
      } catch (err) {
        accumulated += `\n\n_[falha: ${err.message}]_`;
        renderNow();
        agentDiv.classList.remove('streaming');
      } finally {
        sendBtn.disabled = false;
        chatStreaming = false;
        clearNodeWorking(agent);
      }
    };
  }

  function renderEntries(name, items, cssClass, mapFn) {
    const list  = document.getElementById(`${name}-list`);
    const count = document.getElementById(`${name}-count`);
    count.textContent = `${items.length} ${name === 'decisions' ? 'decisões' : name === 'corrections' ? 'correções' : 'armadilhas'}`;
    if (items.length === 0) {
      list.innerHTML = `<div class="no-data">Nenhum registro ainda.</div>`;
      return;
    }
    list.innerHTML = items.map(item => {
      const m = mapFn(item);
      return `<div class="entry-card ${cssClass}">
        <div class="entry-date">${esc(m.date)}</div>
        <div class="entry-what">${esc(m.what)}</div>
        ${m.why ? `<div class="entry-why">${esc(m.why)}</div>` : ''}
      </div>`;
    }).join('');
  }

  function renderObs() {
    if (!data) return;
    const query = (document.getElementById('obs-search').value || '').toLowerCase();
    const filtered = query
      ? data.observations.filter(o =>
          (o.file || '').toLowerCase().includes(query) ||
          (o.cmd || '').toLowerCase().includes(query) ||
          (o.content || '').toLowerCase().includes(query)
        )
      : data.observations;

    document.getElementById('obs-count').textContent =
      filtered.length === data.observations.length
        ? `${data.observations.length} observações`
        : `${filtered.length} de ${data.observations.length} observações`;

    const list = document.getElementById('obs-list');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="no-data">Nenhuma observação encontrada.</div>';
      return;
    }

    list.innerHTML = filtered.map(o => {
      const ts = (o.ts || '').slice(0, 16).replace('T', ' ');
      let content = '';
      if (o.type === 'file_edit') {
        content = esc(o.file || '');
        if (o.diff && typeof o.diff.ins === 'number') {
          const tag = o.diff.tracked === false ? ' novo' : '';
          content += `<span class="obs-extra">+${o.diff.ins}/-${o.diff.del || 0}${tag}</span>`;
        }
      }
      else if (o.type === 'bash') {
        content = esc((o.cmd || '').slice(0, 180));
        if (o.exit !== undefined && o.exit !== null) {
          content += o.exit === 0
            ? `<span class="obs-exit-ok">exit 0</span>`
            : `<span class="obs-exit-fail">exit ${o.exit}</span>`;
        }
        if (o.output_summary) {
          content += `<span class="obs-extra">${esc(o.output_summary)}</span>`;
        }
      } else if (o.type === 'firefighter_triage') {
        const head = `🚒 ${esc(o.agent || '?')} · ${o.events}/${o.threshold} eventos · <code>${esc((o.query || '').slice(0, 80))}</code>`;
        const diag = o.diagnosis ? `<div class="obs-extra" style="display:block;margin-top:4px;white-space:pre-wrap">${esc(o.diagnosis.slice(0, 600))}</div>` : '';
        content = head + diag;
      } else if (o.type === 'agent_call') {
        content = `<code>${esc(o.agent || '?')}</code>${o.description ? ' — ' + esc(o.description) : ''}`;
      } else {
        content = esc(o.content || JSON.stringify(o));
      }
      return `<div class="obs-item">
        <span class="obs-ts">${ts}</span>
        <span class="obs-type ${esc(o.type)}">${esc(o.type)}</span>
        <span class="obs-content">${content}</span>
      </div>`;
    }).join('');
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  load();
  // Auto-refresh every 10s (pula enquanto há streaming ativo de chat)
  setInterval(() => { if (!chatStreaming) load(); }, 10000);
</script>
</body>
